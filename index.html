```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Open Website</title>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
</head>

<body>

    <button onclick="openWebsite()">
        Open Website
    </button>


    <script>

        let pyodide;


        async function startPython() {

            pyodide = await loadPyodide();

            // Python variable
            pyodide.runPython(`
website_url = "https://gamebanana.com/mods/703108"
            `);
        }


        async function openWebsite() {

            // Get the Python variable
            const url =
                pyodide.globals.get("website_url");

            // Open it
            window.open(
                url,
                "_blank"
            );
        }


        // Start Python
        startPython();

    </script>

</body>
</html>
```
