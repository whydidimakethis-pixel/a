<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Website</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
</head>

<body>

    <button id="openButton" disabled>
        Loading Python...
    </button>

    <script>
        let pyodide;

        async function startPython() {
            pyodide = await loadPyodide();

            pyodide.runPython(`
import random
import string

def get_random_link():
    random_string = ''.join(
        random.choices(
            string.ascii_lowercase + string.digits,
            k=8
        )
    )

    return "https://tinyurl.com/" + random_string
            `);

            document.getElementById("openButton").disabled = false;
            document.getElementById("openButton").textContent = "Open Website";
        }

        async function openWebsite() {
            const websiteUrl = pyodide.runPython("get_random_link()");

            window.open(
                websiteUrl,
                "_blank",
                "noopener,noreferrer"
            );
        }

        document
            .getElementById("openButton")
            .addEventListener("click", openWebsite);

        startPython().catch(error => {
            console.error(error);
            document.getElementById("openButton").textContent =
                "Failed to load Python";
        });
    </script>

</body>
</html>
